        <div style={{background:'rgba(247,115,106,.1)',color:'#f7736a',padding:'8px 16px',fontSize:12,textAlign:'center',borderBottom:'1px solid #1e2130'}}>
          {blockStatus.blockedByMe
            ? <>🚫 You blocked this user. <span style={{textDecoration:'underline',cursor:'pointer'}} onClick={async()=>{await apiFetch(`/users/${chat._id}/unblock`,{method:'POST'});setBlockStatus(s=>({...s,blockedByMe:false}));}}>Unblock</span> to send messages.</>
            : "🚫 You can't message this user right now."}
        </div>
      )}

      {isGroup&&showPolls&&(
        <PollPanel
          polls={polls}
          me={me}
          group={chat}
          onClose={()=>setShowPolls(false)}
          onCreate={async(question,options)=>{
            try{ await apiFetch('/polls',{method:'POST',body:JSON.stringify({groupId:chat._id,question,options})}); }
            catch(err){alert(err.message);}
          }}
          onVote={async(pollId,optionIndex)=>{
            try{ await apiFetch(`/polls/${pollId}/vote`,{method:'POST',body:JSON.stringify({optionIndex})}); }
            catch(err){alert(err.message);}
          }}
          onCloseP={async(pollId)=>{
            try{ await apiFetch(`/polls/${pollId}/close`,{method:'POST'}); }
            catch(err){alert(err.message);}
          }}
          onDelete={(pollId)=>{
            setConfirmBox({
              title:'Delete poll?', message:'This will remove the poll for everyone in the group.', confirmText:'Delete', danger:true,
              onConfirm:async()=>{
                setConfirmBox(null);
                try{ await apiFetch(`/polls/${pollId}`,{method:'DELETE'}); }
                catch(err){alert(err.message);}
              }
            });
          }}
        />
      )}

      {showSearch&&(
        <div className="search-bar">
          <input autoFocus value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search messages, files..."/>
          {search&&<span style={{fontSize:12,color:'#5a607a',whiteSpace:'nowrap'}}>{filteredMsgs.length} found</span>}
          <button onClick={()=>{setShowSearch(false);setSearch('');}} style={{background:'none',border:'none',color:'#5a607a',cursor:'pointer',fontSize:20,lineHeight:1}}>×</button>
        </div>
      )}

      {pinnedMsgs.length>0&&(()=>{
        const safeIdx=pinnedMsgs.length>0?pinIdx%pinnedMsgs.length:0;
        const pm=pinnedMsgs[safeIdx];
        return(
        <div className="pinned-bar" onClick={()=>{
          if(!pm) return;
          const el=document.getElementById('msg-'+pm._id);
          if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.transition='all .4s';el.style.outline='2.5px solid #ffd166';el.style.borderRadius='14px';setTimeout(()=>{el.style.outline='';el.style.borderRadius='';},1800);}
          setPinIdx(i=>pinnedMsgs.length>1?(i+1)%pinnedMsgs.length:0);
        }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffd166" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:10,color:'#ffd166',fontWeight:700,marginBottom:2}}>
              {pinnedMsgs.length>1?`Pinned ${safeIdx+1} of ${pinnedMsgs.length}`:'Pinned Message'}
            </div>
            <div style={{fontSize:12,color:'#dde1f0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'calc(100vw - 200px)'}}>
              {pm?.type==='image'?'Photo':pm?.type==='file'?(pm?.fileName||'File'):(pm?.content||'').slice(0,80)}
            </div>
          </div>
          {pinnedMsgs.length>1&&<span style={{fontSize:11,color:'#ffd16699',flexShrink:0}}>tap ↕</span>}
        </div>
        );
      })()}

      <div className="messages" onClick={()=>{setShowEmoji(false);}}>
        {filteredMsgs.map((msg,i)=>(
          <MsgBubble key={msg._id||i} msg={msg} me={me} isGroup={isGroup}
            isPinned={!!userPins.find(p=>p.messageId===msg._id)}
            onReply={m=>{setReplyMsg(m);inputRef.current?.focus();}}
            onForward={setFwdMsg}
            onEdit={editMsg} onDelete={deleteMsg}
            onReact={reactMsg} onPin={pinMsg}
            onViewFile={setViewFile}
            isFresh={freshIds.has(msg._id)}
            allMessages={messages}/>
        ))}
        {search&&filteredMsgs.length===0&&(
          <div style={{textAlign:'center',color:'#5a607a',fontSize:13,marginTop:40}}>No results for &ldquo;{search}&rdquo;</div>
        )}
        <div ref={endRef}/>
      </div>

      {viewFile&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:800,display:'flex',alignItems:'center',justifyContent:'center'}}
          onClick={()=>setViewFile(null)}>
          <div style={{background:'#13151c',border:'1px solid #1e2130',borderRadius:14,width:'min(760px,92vw)',maxHeight:'86vh',display:'flex',flexDirection:'column',overflow:'hidden'}}
            onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',borderBottom:'1px solid #1e2130'}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{viewFile.fileName}</div>
                <div style={{fontSize:11,color:'#5a607a'}}>{fmtSize(viewFile.fileSize)}</div>
              </div>
              <a href={`${BASE}${viewFile.url}`} download={viewFile.fileName} target="_blank" rel="noreferrer"
                style={{color:'#7c6af7',textDecoration:'none',fontSize:13,fontWeight:600}}>⬇ Download</a>
              <span style={{cursor:'pointer',color:'#5a607a',display:'inline-flex'}} onClick={()=>setViewFile(null)}>{IC.close}</span>
            </div>
            <div style={{flex:1,overflow:'auto',background:'#0a0c10',minHeight:200,display:'flex',alignItems:'center',justifyContent:'center'}}>
              {(()=>{
                const url=`${BASE}${viewFile.url}`;
                const name=(viewFile.fileName||'').toLowerCase();
                if(name.match(/\.pdf$/)) return <iframe src={url} style={{width:'100%',height:'75vh',border:'none'}} title="preview"/>;
                if(name.match(/\.(png|jpe?g|gif|webp|svg)$/)) return <img src={url} style={{maxWidth:'100%',maxHeight:'75vh',objectFit:'contain'}} alt={viewFile.fileName}/>;
                if(name.match(/\.(mp4|webm|mov)$/)) return <video src={url} controls style={{maxWidth:'100%',maxHeight:'75vh'}}/>;
                if(name.match(/\.(mp3|wav|ogg)$/)) return <audio src={url} controls style={{width:'90%',margin:'40px 0'}}/>;
                if(name.match(/\.(txt|csv|json|log|md)$/)) return <iframe src={url} style={{width:'100%',height:'75vh',border:'none',background:'#fff'}} title="preview"/>;
                return (
                  <div style={{textAlign:'center',padding:40,color:'#5a607a'}}>
                    <div style={{fontSize:44,marginBottom:10}}>📄</div>
                    <div style={{fontSize:13}}>Preview isn't available for this file type in the browser.</div>
                    <div style={{fontSize:12,marginTop:4}}>Use the Download button above to open it.</div>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      )}
      {notifToast&&(
        <div style={{background:'rgba(124,106,247,0.9)',color:'#fff',padding:'8px 16px',
          fontSize:13,fontWeight:600,textAlign:'center',borderTop:'1px solid #7c6af7'}}>
          {notifToast}
        </div>
      )}
      <div className="typing-bar">{typingUser?`${typingUser} is typing...`:''}</div>

      {replyMsg&&(
        <div className="reply-bar">
          <div style={{color:'#7c6af7',fontSize:18}}>↩</div>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'#7c6af7',fontWeight:700}}>Replying to {replyMsg.sender?.name||'Unknown'}</div>
            <div style={{fontSize:12,color:'#5a607a',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:300}}>
              {replyMsg.type==='image'?'Photo':replyMsg.type==='file'?replyMsg.fileName:replyMsg.content}
            </div>
          </div>
          <button className="reply-bar-close" onClick={()=>setReplyMsg(null)}>×</button>
        </div>
      )}

      {showEmoji&&<EmojiPicker onSelect={e=>{setText(t=>t+e);setShowEmoji(false);inputRef.current?.focus();}}/>}

      <div className="input-wrap">
        {showCmd&&cmdMatches.length>0&&(
          <div className="cmd-suggest">
            {cmdMatches.map((c,i)=>(
              <div key={i} className="cmd-suggest-item" onMouseDown={e=>{e.preventDefault();setText(c.cmd+' ');setShowCmd(false);inputRef.current?.focus();}}>
                <b>{c.cmd}</b>
                <span className="cmd-suggest-hint">{c.desc}</span>
              </div>
            ))}
          </div>
        )}
        {recording&&(
          <div className="rec-bar">
            <div className="rec-dot"/>
            <span>Recording {Math.floor(recTime/60)}:{String(recTime%60).padStart(2,'0')}</span>
            <button onClick={()=>{if(mediaRec.current){mediaRec.current.ondataavailable=null;mediaRec.current.onstop=null;try{mediaRec.current.stop();}catch(e){}clearInterval(recTimer.current);setRecording(false);setRecTime(0);}}} style={{background:'none',border:'none',color:'#5a607a',cursor:'pointer',fontSize:12}}>✕ Cancel</button>
          </div>
        )}
        <div className="input-row">
          <input type="file" ref={fileRef} style={{display:'none'}} multiple onChange={sendFiles} accept="*/*"/>
          <input type="file" ref={gifRef} style={{display:'none'}} onChange={sendGif} accept="image/*,video/*"/>
          <button className="icon-btn" title="Attach file" onClick={()=>fileRef.current.click()} disabled={isBlocked} style={isBlocked?{opacity:.4,cursor:'not-allowed'}:{}}>{IC.attach}</button>
          <button className="icon-btn" title="Send GIF" onClick={()=>gifRef.current.click()} disabled={isBlocked} style={isBlocked?{opacity:.4,cursor:'not-allowed'}:{fontSize:11,fontWeight:800,color:'#3ecfcf',letterSpacing:'-0.5px'}}>GIF</button>
          <button className="icon-btn" title="Location" onClick={shareLocation} disabled={isBlocked} style={isBlocked?{opacity:.4,cursor:'not-allowed'}:{}}>{IC.loc}</button>
          <button className={`icon-btn ${showEmoji?'active':''}`} title="Emoji" onClick={e=>{e.stopPropagation();setShowEmoji(s=>!s);}} disabled={isBlocked} style={isBlocked?{opacity:.4,cursor:'not-allowed'}:{}}>{IC.emoji}</button>
          {!recording
            ?<textarea ref={inputRef} className="msg-input" placeholder={isBlocked?"You can't message this user":"Message..."}
                value={text} onChange={handleType} rows={1} spellCheck="true" disabled={isBlocked}
                style={isBlocked?{opacity:.5,cursor:'not-allowed'}:{}}
                onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}/>
            :<div style={{flex:1,background:'#13151c',border:'1.5px solid #f7736a',borderRadius:12,padding:'9px 14px',color:'#f7736a',fontSize:14}}>🎤 Recording...</div>}
          {!recording
            ?<button className="send-btn" onClick={send} disabled={isBlocked} style={isBlocked?{opacity:.3,cursor:'not-allowed'}:(text?{}:{opacity:.5})}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </button>
            :<button className="send-btn" onClick={stopRec} style={{background:'#06d6a0'}}><span style={{color:'#fff'}}>{IC.stop}</span>
              </button>}
          {!recording&&!text&&!isBlocked&&(
            <button className="icon-btn" title="Voice message" onClick={startRec} style={{color:'#7c6af7'}}>{IC.mic}</button>
          )}
        </div>
      </div>

      {fwdMsg&&(
        <div className="fwd-modal">
          <div className="fwd-card">
            <div className="fwd-title">📨 Forward to...</div>
            <div style={{background:'#0d0f14',borderRadius:8,padding:10,marginBottom:12,fontSize:12,color:'#9aa0b4'}}>
              {fwdMsg.type==='text'?fwdMsg.content?.slice(0,60):fwdMsg.fileName||fwdMsg.type||'File'}
            </div>
            <div className="modal-list">
              {[...allGroups.map(g=>({...g,_isGroup:true})),...allUsers].map(u=>(
                <div key={u._id} className="modal-user" onClick={()=>{
                  const payload={content:fwdMsg.content,type:fwdMsg.type||'text',fileName:fwdMsg.fileName,fileSize:fwdMsg.fileSize};
                  if(u._isGroup) socket.emit('send_group_message',{groupId:u._id,...payload});
                  else socket.emit('send_message',{to:u._id,...payload});
                  setFwdMsg(null);
                }}>
                  {u._isGroup
                    ?<div style={{width:34,height:34,borderRadius:'50%',background:'linear-gradient(135deg,#3ecfcf,#1a8c7a)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',flexShrink:0}}>{IC.people}</div>
                    :<Avatar user={u} size={34}/>}
                  <div>
                    <div style={{fontSize:13,fontWeight:600}}>{u.name}</div>
                    <div style={{fontSize:11,color:'#5a607a'}}>{u._isGroup?`Group · ${u.members?.length||0} members`:u.online?'🟢 Online':'⚫ Offline'}</div>
                  </div>
                </div>
              ))}
            </div>
            <button className="modal-close" onClick={()=>setFwdMsg(null)}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
};

// ── New Chat Modal ─────────────────────────────────────────────────────────────
const NewChatModal=({onClose,onSelect,allUsers})=>{
  const [tab,setTab]=React.useState('direct');
  const [search,setSearch]=React.useState('');
  const [gname,setGname]=React.useState('');
  const [sel,setSel]=React.useState([]);
  const filtered=allUsers.filter(u=>u.name.toLowerCase().includes(search.toLowerCase())||u.email.toLowerCase().includes(search.toLowerCase()));
  const [err,setErr]=React.useState('');
  const createGroup=async()=>{
    if(!gname.trim()){setErr('Enter a group name');return;}
    if(sel.length<1){setErr('Select at least one member');return;}
    try{
      const g=await apiFetch('/groups',{method:'POST',body:JSON.stringify({name:gname,members:sel.map(u=>u._id)})});
      onSelect(g,true);onClose();
    }catch(e){setErr(e.message);}
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">New Chat</div>
        <div className="tabs" style={{marginBottom:14}}>
          <div className={`tab ${tab==='direct'?'active':''}`} onClick={()=>setTab('direct')}>Direct</div>
          <div className={`tab ${tab==='group'?'active':''}`} onClick={()=>setTab('group')}>Group</div>
        </div>
        {err&&<div className="auth-err">⚠ {err}</div>}
        {tab==='group'&&<>
          <input className="auth-input" placeholder="Group name" value={gname} onChange={e=>setGname(e.target.value)} style={{marginBottom:8}}/>
          {sel.length>0&&<div style={{marginBottom:8,fontSize:11,color:'#3ecfcf',fontWeight:600}}>✓ {sel.map(u=>u.name).join(', ')}</div>}
        </>}
        <input className="search-input" placeholder="Search users..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:10}}/>
        <div className="modal-list">
          {filtered.map(u=>(
            <div key={u._id} className="modal-user" onClick={()=>{
              if(tab==='direct'){onSelect(u,false);onClose();}
              else setSel(p=>p.find(x=>x._id===u._id)?p.filter(x=>x._id!==u._id):[...p,u]);
            }}>
              <div style={{position:'relative'}}>
                <Avatar user={u} size={36}/>
                {u.online&&<div className="online-dot"/>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600}}>{u.name}</div>
                <div style={{fontSize:11,color:'#5a607a'}}>{u.email}</div>
              </div>
              {tab==='group'&&sel.find(x=>x._id===u._id)&&<div style={{color:'#7c6af7',display:'inline-flex'}}>{IC.check}</div>}
            </div>
          ))}
        </div>
        {tab==='group'&&<button className="auth-btn" onClick={createGroup} style={{marginTop:12}}>Create Group</button>}
        <button className="modal-close" onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
};

// ── Settings Panel ─────────────────────────────────────────────────────────────
const SettingsPanel=({user,onClose,onSave})=>{
  const [name,setName]=React.useState(user.name||'');
  const [status,setStatus]=React.useState(user.status||'Hey! I am using D Chat');
  const [avatar,setAvatar]=React.useState(user.avatar||'');
  const [notif,setNotif]=React.useState(localStorage.getItem('dchat_notif')!=='off');
  const [sound,setSound]=React.useState(localStorage.getItem('dchat_sound')!=='off');
  const [notifPos,setNotifPos]=React.useState(localStorage.getItem('dchat_notif_pos')||'top-right');
  const [saving,setSaving]=React.useState(false);
  const [msg,setMsg]=React.useState('');
  const [uploading,setUploading]=React.useState(false);
  const photoRef=React.useRef(null);

  const [selTheme,setSelTheme]=React.useState(localStorage.getItem('dchat_theme')||'dark');

  const uploadPhoto=async e=>{
    const file=e.target.files[0];if(!file) return;
    if(file.size>5*1024*1024){setMsg('⚠ Max 5MB');return;}
    setUploading(true);
    try{
      const token=localStorage.getItem('dchat_token');
      const fd=new FormData();fd.append('avatar',file);
      const res=await fetch(API+'/users/avatar',{method:'POST',headers:{Authorization:`Bearer ${token}`},body:fd});
      const d=await res.json();
      if(!res.ok) throw new Error(d.error);
      setAvatar(d.avatar);
      const stored=JSON.parse(localStorage.getItem('dchat_user')||'{}');
      localStorage.setItem('dchat_user',JSON.stringify({...stored,avatar:d.avatar}));
      setMsg('✅ Photo updated!');
      onSave({name,status,avatar:d.avatar});
    }catch(e){setMsg('⚠ '+e.message);}
    setUploading(false);
  };

  const save=async()=>{
    setSaving(true);setMsg('');
    try{
      const token=localStorage.getItem('dchat_token');
      const res=await fetch(API+'/users/profile',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({name,status})});
      const d=await res.json();
      if(!res.ok) throw new Error(d.error||'Failed');
      const stored=JSON.parse(localStorage.getItem('dchat_user')||'{}');
      localStorage.setItem('dchat_user',JSON.stringify({...stored,name,status}));
      localStorage.setItem('dchat_notif',notif?'on':'off');
      localStorage.setItem('dchat_sound',sound?'on':'off');
      localStorage.setItem('dchat_theme',selTheme);
      applyTheme(selTheme);
      localStorage.setItem('dchat_notif_pos',notifPos);
      setMsg('✅ Saved!');
      setTimeout(()=>{setMsg('');onSave({name,status,avatar});},1200);
    }catch(e){setMsg('⚠ '+e.message);}
    setSaving(false);
  };

  const Toggle=({on,onClick})=>(<div className={`toggle ${on?'on':''}`} onClick={onClick}/>);

  return(
    <div className="settings-overlay" onClick={()=>{applyTheme(localStorage.getItem('dchat_theme')||'dark');onClose();}}>
      <div className="settings-card" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
          <div className="settings-title">⚙️ Settings</div>
          <button onClick={()=>{applyTheme(localStorage.getItem('dchat_theme')||'dark');onClose();}} style={{background:'none',border:'none',color:'#5a607a',fontSize:24,cursor:'pointer',lineHeight:1}}>×</button>
        </div>

        {/* Profile */}
        <div className="settings-section">
          <div className="settings-label">👤 Profile</div>
          <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:16,background:'#0d0f14',borderRadius:12,padding:14}}>
            <div style={{position:'relative',cursor:'pointer'}} onClick={()=>photoRef.current.click()}>
              {avatar
                ?<img src={`${BASE}${avatar}`} style={{width:56,height:56,borderRadius:'50%',objectFit:'cover',display:'block'}}/>
                :<div style={{width:56,height:56,borderRadius:'50%',background:'linear-gradient(135deg,#7c6af7,#3ecfcf)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:20,color:'#fff'}}>{initials(name)}</div>}
              <div style={{position:'absolute',bottom:0,right:0,background:'#7c6af7',borderRadius:'50%',width:22,height:22,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',border:'2px solid #0d0f14'}}>
                {uploading?<span style={{fontSize:10}}>...</span>:IC.edit}
              </div>
              <input ref={photoRef} type="file" accept="image/*" style={{display:'none'}} onChange={uploadPhoto}/>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:16,fontWeight:700}}>{name}</div>
              <div style={{fontSize:12,color:'#5a607a'}}>{user.email}</div>
              <div style={{fontSize:11,color:'#7c6af7',marginTop:4,cursor:'pointer'}} onClick={()=>photoRef.current.click()}>
                {uploading?'Uploading...':'📷 Change photo'}
              </div>
            </div>
          </div>
          <div style={{fontSize:11,color:'#5a607a',marginBottom:4}}>Display Name</div>
          <input className="settings-input" value={name} onChange={e=>setName(e.target.value)} placeholder="Your name"/>
          <div style={{fontSize:11,color:'#5a607a',margin:'10px 0 4px'}}>Status</div>
          <input className="settings-input" value={status} onChange={e=>setStatus(e.target.value)} placeholder="Status message"/>
        </div>

        {/* Theme */}
        <div className="settings-section">
          <div className="settings-label">🎨 Chat Theme</div>
          <div className="theme-grid">
            {THEMES.map(t=>(
              <div key={t.id} className={`theme-item ${selTheme===t.id?'active':''}`} style={{background:t.bg}} onClick={()=>{setSelTheme(t.id);applyTheme(t.id);}}>
                <div className="theme-preview">
                  <div style={{background:t.panel}}/>
                  <div style={{background:t.mine,flex:'.6'}}/>
                </div>
                <div className="theme-name" style={{color:selTheme===t.id?'#7c6af7':'#9aa0b4'}}>{t.label}{selTheme===t.id?' ✓':''}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Notifications */}
        <div className="settings-section">
          <div className="settings-label" style={{display:'flex',alignItems:'center',gap:6}}>{IC.bell} Notifications</div>
          <div className="settings-row">
            <div><div className="settings-row-label">Browser Notifications</div><div className="settings-row-sub">Popup on new message</div></div>
            <Toggle on={notif} onClick={async()=>{
              if(!notif){
                const p=await Notification.requestPermission();
                if(p==='granted'){setNotif(true);setMsg('✅ Notifications enabled!');}
                else setMsg('⚠ Allow in browser address bar → 🔒 → Notifications');
              }else{setNotif(false);}
            }}/>
          </div>
          <div className="settings-row">
            <div><div className="settings-row-label">Message Sound</div><div className="settings-row-sub">Beep on new message</div></div>
            <Toggle on={sound} onClick={()=>{setSound(s=>{const n=!s;localStorage.setItem('dchat_sound',n?'on':'off');if(n)playBeep();return n;});}}/>
          </div>
          <div className="settings-row">
            <div><div className="settings-row-label">Notification Position</div><div className="settings-row-sub">Where to show notifications</div></div>
            <select value={notifPos} onChange={e=>setNotifPos(e.target.value)}
              style={{background:'#0d0f14',border:'1px solid #1e2130',borderRadius:8,padding:'6px 10px',color:'#dde1f0',fontSize:12,outline:'none',cursor:'pointer'}}>
              <option value="top-right">Top Right</option>
              <option value="top-left">Top Left</option>
              <option value="bottom-right">Bottom Right</option>
              <option value="bottom-left">Bottom Left</option>
            </select>
          </div>
        </div>

        {msg&&<div style={{padding:'8px 12px',borderRadius:8,marginBottom:12,fontSize:13,background:msg.startsWith('✅')?'rgba(6,214,160,.1)':'rgba(247,115,106,.1)',color:msg.startsWith('✅')?'#06d6a0':'#f7736a'}}>{msg}</div>}
        <button className="settings-btn" onClick={save} disabled={saving} style={{width:'100%'}}>
          {saving?'Saving...':<span style={{display:'flex',alignItems:'center',gap:6}}>{IC.save} Save Changes</span>}
        </button>
      </div>
    </div>
  );
};

// ── Group Info Panel ───────────────────────────────────────────────────────────
const GroupInfoPanel=({group,me,allUsers,onClose,onUpdate,onLeft})=>{
  const [g,setG]=React.useState(group);
  const [editName,setEditName]=React.useState(false);
  const [newName,setNewName]=React.useState(group.name);
  const [showAdd,setShowAdd]=React.useState(false);
  const [search,setSearch]=React.useState('');
  const [msg,setMsg]=React.useState('');
  const [confirmBox,setConfirmBox]=React.useState(null);
  const isAdmin=(g.admin?._id||g.admin)===me.id||(g.admin?._id||g.admin)===me._id;

  const addMember=async(userId)=>{
    try{
      const token=localStorage.getItem('dchat_token');
      const res=await fetch(`${API}/groups/${g._id}/members`,{
        method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({userId})
      });
      const d=await res.json();
      if(!res.ok) throw new Error(d.error);
      setG(d);onUpdate(d);setMsg('✅ Member added!');setShowAdd(false);
      setTimeout(()=>setMsg(''),2000);
    }catch(e){setMsg('⚠ '+e.message);}
  };

  const removeMember=(userId)=>{
    setConfirmBox({
      message:userId===(me.id||me._id)?'Leave this group?':'Remove this member from the group?', confirmText:userId===(me.id||me._id)?'Leave':'Remove', danger:true,
      onConfirm:async()=>{
        setConfirmBox(null);
        try{
          const token=localStorage.getItem('dchat_token');
          const res=await fetch(`${API}/groups/${g._id}/members/${userId}`,{
            method:'DELETE',headers:{Authorization:`Bearer ${token}`}
          });
          const d=await res.json();
          if(!res.ok) throw new Error(d.error);
          if(userId===(me.id||me._id)){onLeft&&onLeft(g._id);return;}
          setG(d);onUpdate(d);setMsg('✅ Member removed!');
          setTimeout(()=>setMsg(''),2000);
        }catch(e){setMsg('⚠ '+e.message);}
      }
    });
  };

  const saveName=async()=>{
    try{
      const token=localStorage.getItem('dchat_token');
      const res=await fetch(`${API}/groups/${g._id}`,{
        method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({name:newName})
      });
      const d=await res.json();
      if(!res.ok) throw new Error(d.error);
      setG({...g,name:newName});onUpdate({...g,name:newName});setEditName(false);
    }catch(e){setMsg('⚠ '+e.message);}
  };

  const notInGroup=allUsers.filter(u=>!g.members?.find(m=>(m._id||m)===u._id));
  const filtered=notInGroup.filter(u=>u.name.toLowerCase().includes(search.toLowerCase()));

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{width:420,maxHeight:'88vh'}} onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div style={{textAlign:'center',padding:'0 0 20px'}}>
          <div style={{width:72,height:72,borderRadius:'50%',background:'linear-gradient(135deg,#3ecfcf,#1a8c7a)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',margin:'0 auto 12px'}}>{React.cloneElement(IC.people,{width:32,height:32})}</div>
          {editName
            ?<div style={{display:'flex',gap:8,alignItems:'center',justifyContent:'center'}}>
              <input value={newName} onChange={e=>setNewName(e.target.value)}
                style={{background:'#0d0f14',border:'1.5px solid #7c6af7',borderRadius:8,padding:'6px 12px',color:'#dde1f0',fontSize:15,fontWeight:700,outline:'none'}}
                onKeyDown={e=>e.key==='Enter'&&saveName()}/>
              <button onClick={saveName} style={{background:'#7c6af7',border:'none',borderRadius:6,padding:'6px 12px',color:'#fff',cursor:'pointer',display:'inline-flex',alignItems:'center'}}>{IC.check}</button>
              <button onClick={()=>setEditName(false)} style={{background:'#1a1d27',border:'none',borderRadius:6,padding:'6px 10px',color:'#5a607a',cursor:'pointer',display:'inline-flex',alignItems:'center'}}>{IC.close}</button>
            </div>
            :<div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <div style={{fontSize:18,fontWeight:700}}>{g.name}</div>
              {isAdmin&&<button onClick={()=>setEditName(true)} style={{background:'none',border:'none',color:'#7c6af7',cursor:'pointer',display:'inline-flex',alignItems:'center'}}>{IC.edit}</button>}
            </div>}
          <div style={{fontSize:12,color:'#5a607a',marginTop:4}}>{g.members?.length||0} members · Admin: {g.admin?.name||'Unknown'}</div>
        </div>

        {msg&&<div style={{padding:'6px 12px',borderRadius:8,marginBottom:12,fontSize:12,background:msg.startsWith('✅')?'rgba(6,214,160,.1)':'rgba(247,115,106,.1)',color:msg.startsWith('✅')?'#06d6a0':'#f7736a'}}>{msg}</div>}

        {confirmBox&&(
          <ConfirmModal message={confirmBox.message} confirmText={confirmBox.confirmText} danger={confirmBox.danger}
            onConfirm={confirmBox.onConfirm} onCancel={()=>setConfirmBox(null)}/>
        )}

        {/* Add member */}
        {isAdmin&&(
          <div style={{marginBottom:16}}>
            {showAdd
              ?<div>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search users to add..."
                  style={{width:'100%',background:'#0d0f14',border:'1px solid #1e2130',borderRadius:8,padding:'8px 12px',color:'#dde1f0',fontSize:13,outline:'none',marginBottom:8}}
                  autoFocus/>
                <div style={{maxHeight:140,overflowY:'auto'}}>
                  {filtered.map(u=>(
                    <div key={u._id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px',borderRadius:8,cursor:'pointer'}}
                      onMouseEnter={e=>e.currentTarget.style.background='#1a1d27'}
                      onMouseLeave={e=>e.currentTarget.style.background=''}
                      onClick={()=>addMember(u._id)}>
                      <Avatar user={u} size={32}/>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:600}}>{u.name}</div>
                        <div style={{fontSize:11,color:'#5a607a'}}>{u.online?'🟢 Online':'⚫ Offline'}</div>
                      </div>
                      <span style={{color:'#7c6af7',fontSize:12,fontWeight:700}}>+ Add</span>
                    </div>
                  ))}
                  {filtered.length===0&&<div style={{color:'#5a607a',fontSize:12,padding:'8px',textAlign:'center'}}>No users to add</div>}
                </div>
                <button onClick={()=>setShowAdd(false)} style={{width:'100%',background:'#1a1d27',border:'none',borderRadius:8,padding:'8px',color:'#5a607a',cursor:'pointer',marginTop:6,fontSize:12}}>Cancel</button>
              </div>
              :<button onClick={()=>setShowAdd(true)}
                style={{width:'100%',background:'rgba(124,106,247,.15)',border:'1px dashed #7c6af7',borderRadius:10,padding:'10px',color:'#7c6af7',cursor:'pointer',fontSize:13,fontWeight:600}}>
                + Add Members
              </button>}
          </div>
        )}

        {/* Members list */}
        <div style={{fontSize:11,color:'#5a607a',fontWeight:700,textTransform:'uppercase',letterSpacing:'.8px',marginBottom:10}}>Members ({g.members?.length||0})</div>
        <div className="modal-list" style={{maxHeight:260}}>
          {(g.members||[]).map(m=>{
            const memberId=m._id||m;
            const isMe=memberId===me.id||memberId===me._id;
            const memberIsAdmin=(g.admin?._id||g.admin)===memberId;
            return(
              <div key={memberId} style={{display:'flex',alignItems:'center',gap:10,padding:'9px',borderRadius:10}}>
                <div style={{position:'relative'}}>
                  <Avatar user={m} size={38}/>
                  {m.online&&<div className="online-dot"/>}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600}}>{m.name||'Unknown'} {isMe?'(You)':''}</div>
                  <div style={{fontSize:11,color:'#5a607a'}}>{memberIsAdmin?'👑 Admin':m.online?'🟢 Online':'⚫ Offline'}</div>
                </div>
                {isAdmin&&!isMe&&!memberIsAdmin&&(
                  <button onClick={()=>removeMember(memberId)}
                    style={{background:'rgba(247,115,106,.15)',border:'none',borderRadius:6,padding:'4px 10px',color:'#f7736a',cursor:'pointer',fontSize:11,fontWeight:600}}>
                    Remove
                  </button>
                )}
                {!isAdmin&&isMe&&(
                  <button onClick={()=>removeMember(memberId)}
                    style={{background:'rgba(247,115,106,.15)',border:'none',borderRadius:6,padding:'4px 10px',color:'#f7736a',cursor:'pointer',fontSize:11,fontWeight:600}}>
                    Leave
                  </button>
                )}
              </div>
            );
          })}
        </div>

        <button className="modal-close" style={{marginTop:12}} onClick={onClose}>Close</button>
      </div>
    </div>
  );
};

// ── Personal Notes ─────────────────────────────────────────────────────────────
const NotesPanel=({user,onClose})=>{
  const [notes,setNotes]=React.useState([]);
  const [active,setActive]=React.useState(null);
  const [title,setTitle]=React.useState('');
  const [content,setContent]=React.useState('');
  const [color,setColor]=React.useState('#7c6af7');
  const [loading,setLoading]=React.useState(true);
  const [saving,setSaving]=React.useState(false);
  const COLORS=['#7c6af7','#3ecfcf','#f7736a','#ffd166','#06d6a0','#82aaff','#ff6b9d'];
  const [confirmBox,setConfirmBox]=React.useState(null);

  React.useEffect(()=>{
    apiFetch('/notes').then(n=>{setNotes(n);setLoading(false);}).catch(()=>setLoading(false));
  },[]);

  const newNote=()=>{
    setActive('new');setTitle('');setContent('');setColor('#7c6af7');
  };

  const saveNote=async()=>{
    if(!title.trim()&&!content.trim()) return;
    setSaving(true);
    try{
      if(active==='new'){
        const n=await apiFetch('/notes',{method:'POST',body:JSON.stringify({title:title||'Note',content,color})});
        setNotes(p=>[n,...p]);setActive(n._id);
      }else{
        const n=await apiFetch(`/notes/${active}`,{method:'PUT',body:JSON.stringify({title:title||'Note',content,color})});
        setNotes(p=>p.map(x=>x._id===active?n:x));
      }
    }catch(e){}
    setSaving(false);
  };

  const deleteNote=(id)=>{
    setConfirmBox({
      message:'Delete this note? This cannot be undone.', confirmText:'Delete', danger:true,
      onConfirm:async()=>{
        setConfirmBox(null);
        await apiFetch(`/notes/${id}`,{method:'DELETE'});
        setNotes(p=>p.filter(n=>n._id!==id));
        if(active===id){setActive(null);setTitle('');setContent('');}
      }
    });
  };

  const openNote=(n)=>{setActive(n._id);setTitle(n.title);setContent(n.content);setColor(n.color||'#7c6af7');};

  const fmtDate=d=>{const dt=new Date(d);return dt.toLocaleDateString()+' '+dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div style={{background:'#13151c',border:'1px solid #1e2130',borderRadius:20,width:780,height:'85vh',display:'flex',overflow:'hidden',boxShadow:'0 24px 80px rgba(0,0,0,.6)'}} onClick={e=>e.stopPropagation()}>

      {confirmBox&&(
        <ConfirmModal message={confirmBox.message} confirmText={confirmBox.confirmText} danger={confirmBox.danger}
          onConfirm={confirmBox.onConfirm} onCancel={()=>setConfirmBox(null)}/>
      )}

        {/* Sidebar */}
        <div style={{width:240,borderRight:'1px solid #1e2130',display:'flex',flexDirection:'column',background:'#0f1117'}}>
          <div style={{padding:'16px',borderBottom:'1px solid #1e2130',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>{IC.notes} My Notes</div>
            <button onClick={newNote} style={{background:'#7c6af7',border:'none',borderRadius:8,width:28,height:28,cursor:'pointer',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>{IC.plus}</button>
          </div>
          <div style={{flex:1,overflowY:'auto',padding:'8px'}}>
            {loading&&<div style={{color:'#5a607a',fontSize:12,textAlign:'center',padding:20}}>Loading...</div>}
            {!loading&&notes.length===0&&(
              <div style={{color:'#5a607a',fontSize:12,textAlign:'center',padding:20}}>
                No notes yet.<br/>Click + to create one.
              </div>
            )}
            {active==='new'&&(
              <div style={{padding:'10px 12px',borderRadius:10,background:'rgba(124,106,247,.15)',border:'1px solid #7c6af7',marginBottom:6,cursor:'pointer'}}>
                <div style={{fontSize:13,fontWeight:600,color:'#7c6af7'}}>✨ New Note</div>
                <div style={{fontSize:11,color:'#5a607a'}}>Unsaved</div>
              </div>
            )}
            {notes.map(n=>(
              <div key={n._id} style={{display:'flex',alignItems:'center',gap:4,marginBottom:4}}>
                <div
                  onClick={()=>openNote(n)}
                  style={{flex:1,padding:'10px 12px',borderRadius:10,cursor:'pointer',
                    background:active===n._id?'rgba(124,106,247,.15)':'transparent',
                    border:`1px solid ${active===n._id?'#7c6af7':'transparent'}`,
                    borderLeft:`3px solid ${n.color||'#7c6af7'}`,minWidth:0}}
                  onMouseEnter={e=>{if(active!==n._id)e.currentTarget.style.background='#1a1d27';}}
                  onMouseLeave={e=>{if(active!==n._id)e.currentTarget.style.background='transparent';}}>
                  <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title}</div>
                  <div style={{fontSize:11,color:'#5a607a',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.content?.slice(0,40)||'Empty'}</div>
                  <div style={{fontSize:10,color:'#3a3f55',marginTop:3}}>{fmtDate(n.updatedAt)}</div>
                </div>
                <button onClick={e=>{e.stopPropagation();deleteNote(n._id);}}
                  style={{background:'none',border:'none',color:'#3a3f55',cursor:'pointer',padding:'4px',borderRadius:4,flexShrink:0,display:'flex',alignItems:'center'}}
                  onMouseEnter={e=>{e.currentTarget.style.color='#f7736a';e.currentTarget.style.background='rgba(247,115,106,.15)';}}
                  onMouseLeave={e=>{e.currentTarget.style.color='#3a3f55';e.currentTarget.style.background='none';}}
                  title="Delete note">
                  {IC.trash}
                </button>
              </div>
            ))}
          </div>
        </div>

        {/* Editor */}
        <div style={{flex:1,display:'flex',flexDirection:'column'}}>
          {active
            ?<>
              <div style={{padding:'14px 20px',borderBottom:'1px solid #1e2130',display:'flex',alignItems:'center',gap:12}}>
                <input value={title} onChange={e=>setTitle(e.target.value)}
                  placeholder="Note title..."
                  style={{flex:1,background:'none',border:'none',color:'#fff',fontSize:17,fontWeight:700,outline:'none',fontFamily:'inherit'}}/>
                <div style={{display:'flex',gap:6}}>
                  {COLORS.map(c=>(
                    <div key={c} onClick={()=>setColor(c)}
                      style={{width:20,height:20,borderRadius:'50%',background:c,cursor:'pointer',
                        border:`2px solid ${color===c?'#fff':'transparent'}`,transition:'border .15s'}}/>
                  ))}
                </div>
                <button onClick={saveNote} disabled={saving}
                  style={{background:'#7c6af7',border:'none',borderRadius:8,padding:'7px 16px',color:'#fff',cursor:'pointer',fontSize:13,fontWeight:700}}>
                  {saving?'Saving...':<span style={{display:'flex',alignItems:'center',gap:4}}>{IC.save} Save</span>}
                </button>
                {active!=='new'&&(
                  <button onClick={()=>deleteNote(active)}
                    style={{background:'rgba(247,115,106,.15)',border:'none',borderRadius:8,padding:'7px 12px',color:'#f7736a',cursor:'pointer',fontSize:13}}>
                    🗑
                  </button>
                )}
                <button onClick={onClose} style={{background:'none',border:'none',color:'#5a607a',cursor:'pointer',fontSize:22,lineHeight:1}}>×</button>
              </div>
              <textarea value={content} onChange={e=>setContent(e.target.value)}
                placeholder="Start writing your note..."
                style={{flex:1,background:'none',border:'none',color:'#dde1f0',fontSize:14,lineHeight:1.7,padding:'20px',resize:'none',outline:'none',fontFamily:'inherit'}}/>
              <div style={{padding:'8px 20px',borderTop:'1px solid #1e2130',display:'flex',justifyContent:'space-between',fontSize:11,color:'#3a3f55'}}>
                <span>{content.length} characters · {content.split(/\s+/).filter(Boolean).length} words</span>
                {active!=='new'&&<span>Last saved: {fmtDate(notes.find(n=>n._id===active)?.updatedAt||new Date())}</span>}
              </div>
            </>
            :<div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'#5a607a'}}>
              <div style={{marginBottom:12}}>
                <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#7c6af7" strokeWidth="1.5" strokeLinecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
              </div>
              <div style={{fontSize:16,fontWeight:600,color:'#dde1f0',marginBottom:6}}>My Notes</div>
              <div style={{fontSize:13,marginBottom:20}}>Private notes only visible to you</div>
              <button onClick={newNote} style={{background:'#7c6af7',border:'none',borderRadius:10,padding:'10px 24px',color:'#fff',cursor:'pointer',fontSize:14,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>{IC.plus} New Note</button>
              <button onClick={onClose} style={{background:'none',border:'none',color:'#5a607a',cursor:'pointer',fontSize:13,marginTop:12}}>Close</button>
            </div>}
        </div>
      </div>
    </div>
  );
};

// ── Main App ───────────────────────────────────────────────────────────────────
const App=()=>{
  const [user,setUser]=React.useState(null);
  const [chats,setChats]=React.useState([]);
  const [groups,setGroups]=React.useState([]);
  const [active,setActive]=React.useState(null);
  const [isGroup,setIsGroup]=React.useState(false);
  const [tab,setTab]=React.useState('chats');
  const [showModal,setShowModal]=React.useState(false);
  const [showSettings,setShowSettings]=React.useState(false);
  const [showNotes,setShowNotes]=React.useState(false);
  const [showGroupInfo,setShowGroupInfo]=React.useState(false);
  const [search,setSearch]=React.useState('');
  const [notifs,setNotifs]=React.useState([]);
  const [unreadCounts,setUnreadCounts]=React.useState({}); // roomId -> count
  const [announcements,setAnnouncements]=React.useState([]);
  const [showAnnounce,setShowAnnounce]=React.useState(false);
  const [showLeaves,setShowLeaves]=React.useState(false);
  const socketRef=React.useRef(null);
  const activeRoomRef=React.useRef(null); // room currently open — never show a badge for it
  const unreadTmr=React.useRef(null);

  const refreshUnread=()=>{apiFetch('/messages/unread-counts').then(c=>{
    if(activeRoomRef.current) delete c[activeRoomRef.current];
    setUnreadCounts(c);
  }).catch(()=>{});};
  // Debounced: lets the open chat's mark_read land first, and avoids a burst of requests
  const refreshUnreadSoon=()=>{clearTimeout(unreadTmr.current);unreadTmr.current=setTimeout(refreshUnread,400);};
  const refreshGroups=()=>apiFetch('/groups').then(gs=>{
    setGroups(gs);
    // If the open group was deleted / I was removed, close it
    setActive(a=>a&&a.members&&!a.self&&!gs.some(g=>g._id===a._id)?null:a);
    return gs;
  }).catch(()=>{});
  const refreshAnnouncements=()=>{apiFetch('/announcements').then(setAnnouncements).catch(()=>{});};

  React.useEffect(()=>{
    const t=localStorage.getItem('dchat_token');
    const u=localStorage.getItem('dchat_user');
    if(t&&u){try{handleLogin(JSON.parse(u),t);}catch(e){localStorage.removeItem('dchat_user');}}
    const onExpired=()=>logout();
    window.addEventListener('dchat-logout',onExpired);
    return()=>window.removeEventListener('dchat-logout',onExpired);
  },[]);

  // Keep track of which room is open so unread badges skip it
  React.useEffect(()=>{
    if(!active||!user){activeRoomRef.current=null;return;}
    activeRoomRef.current=isGroup?`group_${active._id}`:getRoomId(user.id||user._id,active._id);
  },[active?._id,isGroup,user]);

  const handleLogin=(u,t)=>{
    setUser(u);
    socketRef.current?.disconnect();
    const s=io(BASE,{auth:{token:t}});
    socketRef.current=s;
    s.on('connect_error',(e)=>{if(e?.message==='Auth error') logout();});
    s.on('notification',({from,message,room})=>{
      refreshUnreadSoon();
      if(room&&room===activeRoomRef.current&&document.hasFocus()) return; // already looking at this chat
      const pos=localStorage.getItem('dchat_notif_pos')||'top-right';
      const nid='n'+Date.now()+Math.random();
      setNotifs(p=>[...p,{from,message,id:nid,pos}]);
      setTimeout(()=>setNotifs(p=>p.filter(x=>x.id!==nid)),5000);
      showBrowserNotif(`💬 ${from}`,message);
    });
    s.on('user_online',({userId,online})=>{
      setChats(p=>p.map(c=>c._id===userId?{...c,online}:c));
    });
    // Any new message anywhere bumps the unread badge for that room
    s.on('new_message',()=>refreshUnreadSoon());
    // Group created / I was added / removed / group deleted -> reload group list
    s.on('groups_changed',()=>refreshGroups());
    s.on('group_deleted',()=>refreshGroups());
    s.on('group_updated',(g)=>{
      if(!g||!g._id) return;
      setGroups(p=>p.map(x=>x._id===g._id?g:x));
      setActive(a=>a&&a._id===g._id&&a.members?{...a,...g}:a);
    });
    // Admin created / deleted a user -> refresh contacts
    s.on('users_changed',()=>apiFetch('/users').then(setChats).catch(()=>{}));
    // Admin deleted my account
    s.on('force_logout',()=>{alert('Your account was removed by an admin.');logout();});
    // Live admin announcement — pop up + refresh the list
    s.on('announcement',(a)=>{
      setAnnouncements(p=>[{...a,read:false},...p]);
      showBrowserNotif('📢 Announcement', a.message);
      const pos=localStorage.getItem('dchat_notif_pos')||'top-right';
      const nid='a'+Date.now()+Math.random();
      setNotifs(p=>[...p,{from:'📢 Announcement',message:a.message,id:nid,pos}]);
      setTimeout(()=>setNotifs(p=>p.filter(x=>x.id!==nid)),6000);
    });
    // Admin approved/rejected one of my leave requests
    s.on('leave_updated',(leave)=>{
      const pos=localStorage.getItem('dchat_notif_pos')||'top-right';
      const msg=leave.status==='approved'?'✅ Your leave request was approved':leave.status==='rejected'?'❌ Your leave request was rejected':'🕒 A leave entry was added for you (pending)';
      const nid='l'+Date.now()+Math.random();
      setNotifs(p=>[...p,{from:'🗓️ Leave Update',message:msg,id:nid,pos}]);
      setTimeout(()=>setNotifs(p=>p.filter(x=>x.id!==nid)),6000);
      showBrowserNotif('🗓️ Leave Update', msg);
    });
    apiFetch('/users').then(setChats).catch(()=>{});
    apiFetch('/groups').then(setGroups).catch(()=>{});
    refreshUnread();
    refreshAnnouncements();
  };

  const logout=()=>{
    localStorage.removeItem('dchat_token');
    localStorage.removeItem('dchat_user');
    socketRef.current?.disconnect();
    socketRef.current=null;
    setUser(null);setChats([]);setGroups([]);setActive(null);setUnreadCounts({});setAnnouncements([]);setNotifs([]);
  };
  const onLeftGroup=(gid)=>{
    setGroups(p=>p.filter(g=>g._id!==gid));
    setActive(a=>a&&a._id===gid?null:a);
    setShowGroupInfo(false);
  };

  if(!user) return <AuthScreen onLogin={handleLogin}/>;

  const fc=chats.filter(c=>c.name?.toLowerCase().includes(search.toLowerCase()));
  const fg=groups.filter(g=>g.name?.toLowerCase().includes(search.toLowerCase()));
  // A personal "Notes to Self" chat — auto-available for every logged-in user,
  // no server-side record needed since it just reuses the normal 1-1 message
  // room logic with yourself as both sender and recipient.
  const selfChat={_id:user.id||user._id,name:'Notes to Self',avatar:user.avatar,online:true,self:true};

  const getNotifStyle=(pos)=>{
    const base={position:'fixed',zIndex:9999};
    if(pos==='top-right') return{...base,top:16,right:16};
    if(pos==='top-left') return{...base,top:16,left:16};
    if(pos==='bottom-right') return{...base,bottom:16,right:16};
    if(pos==='bottom-left') return{...base,bottom:16,left:16};
    return{...base,top:16,right:16};
  };

  return(
    <div className={`app ${active?'chat-open':''}`}>
      {/* Notifications */}
      {notifs.map((n)=>{
        const pos=n.pos||'top-right';
        const idx=notifs.filter(x=>(x.pos||'top-right')===pos).findIndex(x=>x.id===n.id); // stack within the same corner
        const off=16+idx*88;
        return(
        <div key={n.id} className="notif-toast"
          style={{...getNotifStyle(pos),...(pos.includes('top')?{top:off}:{bottom:off})}}
          onClick={()=>setNotifs(p=>p.filter(x=>x.id!==n.id))}>
          <div style={{width:38,height:38,borderRadius:'50%',background:'linear-gradient(135deg,#7c6af7,#3ecfcf)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:15,color:'#fff',flexShrink:0}}>
            {(n.from||'?')[0].toUpperCase()}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:'#fff',marginBottom:2}}>{n.from}</div>
            <div style={{fontSize:12,color:'#9aa0b4',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.message}</div>
            <div style={{fontSize:10,color:'#5a607a',marginTop:3}}>D Chat · {new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
          <div style={{color:'#5a607a',fontSize:18,lineHeight:1,flexShrink:0}}>×</div>
        </div>
        );})}

      {showLeaves&&<LeavePanel onClose={()=>setShowLeaves(false)}/>}

      {/* Sidebar */}
      <div className="sidebar">
        <div className="sidebar-header">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div className="my-avatar" style={{width:38,height:38,fontSize:14}}>
              {user.avatar?<img src={`${BASE}${user.avatar}`} style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}} alt=""/>:initials(user.name)}
            </div>
            <div>
              <div className="my-name">{user.name}</div>
              <div style={{fontSize:11,color:'#5a607a'}}><span className="my-status-dot"/>Online</div>
            </div>
          </div>
          <div className="header-actions" style={{position:'relative'}}>
            <button className="hdr-btn" onClick={()=>setShowLeaves(true)} title="My Leaves">{IC.calendar}</button>
            <button className="hdr-btn" onClick={()=>setShowAnnounce(s=>!s)} title="Announcements" style={{position:'relative'}}>
              {IC.bell}
              {announcements.filter(a=>!a.read).length>0&&
                <span className="unread-badge" style={{position:'absolute',top:-2,right:-2,minWidth:15,height:15,fontSize:9}}>
                  {announcements.filter(a=>!a.read).length}
                </span>}
            </button>
            <button className="hdr-btn" onClick={()=>setShowNotes(true)} title="My Notes">{IC.notes}</button>
            <button className="hdr-btn" onClick={()=>setShowSettings(true)} title="Settings">{IC.settings}</button>
            <button className="hdr-btn" onClick={logout} title="Logout">{IC.logout}</button>

            {showAnnounce&&(
              <div className="announce-panel">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <b style={{fontSize:13,display:'flex',alignItems:'center',gap:6}}>{IC.bell} Announcements</b>
                  {announcements.some(a=>!a.read)&&(
                    <span style={{fontSize:12,color:'#7c6af7',cursor:'pointer'}}
                      onClick={async()=>{await apiFetch('/announcements/read-all',{method:'POST'});setAnnouncements(p=>p.map(a=>({...a,read:true})));}}>
                      Mark all read
                    </span>
                  )}
                </div>
                {announcements.length===0&&<div style={{fontSize:12,color:'#5a607a'}}>No announcements yet.</div>}
                {announcements.map(a=>(
                  <div key={a._id} className={`announce-item ${a.read?'':'unread'}`}>
                    <div>{a.message}</div>
                    <div className="announce-time">{new Date(a.createdAt).toLocaleString()}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        <div className="search-box">
          <input className="search-input" placeholder="🔍 Search chats..."
            value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>

        <div className={`chat-item ${active?._id===(user.id||user._id)&&active?.self?'active':''}`}
          style={{borderBottom:'1px solid #1e2130'}}
          onClick={()=>{setActive(selfChat);setIsGroup(false);}}>
          <div style={{width:42,height:42,borderRadius:'50%',background:'linear-gradient(135deg,#ffd166,#f7736a)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',flexShrink:0}}>{IC.notes}</div>
          <div style={{flex:1,minWidth:0}}>
            <div className="chat-name">Notes to Self</div>
            <div className="chat-preview">Personal chat · only you can see this · try "/"</div>
          </div>
        </div>

        <div className="tabs">
          <div className={`tab ${tab==='chats'?'active':''}`} onClick={()=>setTab('chats')}>
            Chats {fc.length>0&&`(${fc.length})`}
          </div>
          <div className={`tab ${tab==='groups'?'active':''}`} onClick={()=>setTab('groups')}>
            Groups {fg.length>0&&`(${fg.length})`}
          </div>
        </div>

        <div className="chat-list">
          {tab==='chats'&&fc.map(c=>{
            const room=getRoomId(user.id||user._id,c._id);
            const unread=unreadCounts[room]||0;
            return(
            <div key={c._id} className={`chat-item ${active?._id===c._id&&!isGroup?'active':''}`}
              onClick={()=>{setActive(c);setIsGroup(false);setUnreadCounts(p=>({...p,[room]:0}));setTimeout(refreshUnread,600);}}>
              <div style={{position:'relative',flexShrink:0}}>
                <Avatar user={c} size={42}/>
                {c.online&&<div className="online-dot"/>}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                  <div className="chat-name">{c.name}</div>
                  {unread>0&&<span className="unread-badge">{unread>99?'99+':unread}</span>}
                </div>
                <div className="chat-preview">{c.status||c.email}</div>
              </div>
            </div>
          );})}
          {tab==='groups'&&fg.map(g=>{
            const room=`group_${g._id}`;
            const unread=unreadCounts[room]||0;
            return(
            <div key={g._id} className={`chat-item ${active?._id===g._id&&isGroup?'active':''}`}
              onClick={()=>{setActive(g);setIsGroup(true);setUnreadCounts(p=>({...p,[room]:0}));setTimeout(refreshUnread,600);}}>
              <div style={{width:42,height:42,borderRadius:'50%',background:'linear-gradient(135deg,#3ecfcf,#1a8c7a)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',flexShrink:0}}>{IC.people}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                  <div className="chat-name">{g.name}</div>
                  {unread>0&&<span className="unread-badge">{unread>99?'99+':unread}</span>}
                </div>
                <div className="chat-preview">{g.members?.length||0} members</div>
              </div>
            </div>
          );})}
        </div>

        <button className="fab" onClick={()=>setShowModal(true)} title="New chat" style={{color:'#fff'}}>
          {IC.plus}
        </button>
      </div>

      {/* Main */}
      <div className="main">
        {active&&socketRef.current
          ?<ChatWindow key={(isGroup?'g':'u')+active._id} chat={active} me={user} socket={socketRef.current} isGroup={isGroup} allUsers={chats} allGroups={groups}
              onGroupInfo={()=>setShowGroupInfo(true)} onOpenLeaves={()=>setShowLeaves(true)} onBack={()=>setActive(null)} onLeftGroup={onLeftGroup}/>
          :<div className="empty-state">
            <div style={{marginBottom:16,color:'#7c6af7',display:'flex',justifyContent:'center'}}>{React.cloneElement(IC.chatLogo,{width:64,height:64})}</div>
            <div style={{fontSize:20,fontWeight:700,marginBottom:8,color:'#dde1f0'}}>D Chat</div>
            <div style={{fontSize:14}}>Select a chat or start a new conversation</div>
          </div>}
      </div>

      {showModal&&<NewChatModal onClose={()=>setShowModal(false)} onSelect={(c,g)=>{
        if(g){setGroups(p=>p.some(x=>x._id===c._id)?p:[...p,c]);setTab('groups');}
        setActive(c);setIsGroup(g);}} allUsers={chats}/>}
      {showSettings&&<SettingsPanel user={user} onClose={()=>setShowSettings(false)}
        onSave={(updated)=>{setUser(u=>({...u,...updated}));setShowSettings(false);}}/>}
      {showNotes&&<NotesPanel user={user} onClose={()=>setShowNotes(false)}/>}
      {showGroupInfo&&active&&isGroup&&(
        <GroupInfoPanel
          group={active} me={user} allUsers={chats}
          onClose={()=>setShowGroupInfo(false)}
          onLeft={onLeftGroup}
          onUpdate={(g)=>{
            setActive(g);
            setGroups(p=>p.map(x=>x._id===g._id?g:x));
          }}/>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
