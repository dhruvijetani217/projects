<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#060b18"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>CloudVault — Cloud Storage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{-webkit-text-size-adjust:100%}
    body{background:#060b18;font-family:'Inter',sans-serif;color:#f1f5f9;overscroll-behavior-y:none}
    input,button,select,textarea{font-family:'Inter',sans-serif}
    input:focus{outline:2px solid #6366f1;outline-offset:1px}
    button{touch-action:manipulation}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
    .spin{animation:spin 0.8s linear infinite}
    .fade-in{animation:fadeIn 0.3s ease}
    .slide-up{animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1)}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:99px}
    @media (max-width:640px){
      ::-webkit-scrollbar{display:none}
    }
  </style>
</head>
<body><div id="root"></div></body>
</html>
